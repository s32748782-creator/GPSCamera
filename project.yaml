name: GPSCamera
options:
  bundleIdPrefix: com.gpscamera
  deploymentTarget:
    iOS: "16.0"
targets:
  GPSCamera:
    type: application
    platform: iOS
    sources: [GPSCameraApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gpscamera.app
        PRODUCT_NAME: GPSCamera
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: 定位相機
        INFOPLIST_KEY_NSCameraUsageDescription: 用來拍照
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用來在照片上加上經緯度
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 用來把照片存進相簿
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
